<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苗農直送</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5EA;--surface:#FFFFFF;--surface-2:#E6EEDA;--ink:#1E2A1E;--muted:#667565;--line:#DCE5D0;
  --primary:#2E4A2E;--on-primary:#F4F8EC;--sprout:#7DA03C;--accent:#E8A92B;--on-accent:#2A1D00;
  --kraft:#D9C29A;--danger:#B3412F;--hero-bg:#2E4A2E;--hero-ink:#F4F8EC;--stage:#DCE5CF;--frame:#1E2A1E;
  --fs:1;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101810;--surface:#1A241A;--surface-2:#243124;--ink:#E8F0DF;--muted:#9CAA96;--line:#2B3B2B;
    --primary:#A9CE63;--on-primary:#142014;--sprout:#8DB84A;--accent:#EFB840;--kraft:#5A4A30;--danger:#E57A66;
    --hero-bg:#25402A;--hero-ink:#F4F8EC;--stage:#0A100A;--frame:#2B3B2B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101810;--surface:#1A241A;--surface-2:#243124;--ink:#E8F0DF;--muted:#9CAA96;--line:#2B3B2B;
  --primary:#A9CE63;--on-primary:#142014;--sprout:#8DB84A;--accent:#EFB840;--kraft:#5A4A30;--danger:#E57A66;
  --hero-bg:#25402A;--hero-ink:#F4F8EC;--stage:#0A100A;--frame:#2B3B2B;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:calc(16px * var(--fs))}
body{margin:0;height:100%;background:var(--stage);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.serif{font-family:'Noto Serif TC','Songti TC',serif;font-weight:700}
.ic{display:block;flex:none}

.stage{position:relative}
.device{position:absolute;left:0;top:0;width:412px;height:917px;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:36px;box-shadow:0 0 0 8px var(--frame),0 30px 60px -20px rgba(10,30,10,.45)}
@media (max-width:500px){
  .stage{width:100%!important;height:100%!important}
  .device{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
}

.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.hastab{bottom:72px}
.page.hasbar{bottom:88px}
.page.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.enter,.sheet,.dialog,.toast{animation:none!important;transition:none!important}}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:0 8px;z-index:10}
.tabbar.hide{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;color:var(--muted);font-size:.6875rem;font-weight:500}
.tab .pill-bg{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.tab.on{color:var(--primary);font-weight:700}
.tab.on .pill-bg{background:var(--surface-2)}
.badge{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.6875rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.badge.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}

.appbar{display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;background:var(--bg);z-index:5;margin:0 -16px;padding:0 16px}
.appbar h1{margin:0;font-size:1.125rem;flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.page-title{display:flex;align-items:center;justify-content:space-between;height:56px;margin:0}
.page-title h1{margin:0;font-size:1.625rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:26px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:1rem;border:2px solid var(--primary);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--primary)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{height:36px;padding:0 16px;font-size:.8125rem;border-radius:18px}
.btn.xs{height:32px;padding:0 12px;font-size:.75rem;border-radius:16px}
.btn.block{width:100%}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{background:var(--surface-2);border-color:var(--surface-2);color:var(--muted);cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--primary);font-weight:700;font-size:.8125rem}
.link{color:var(--primary);font-weight:500;font-size:.8125rem}

.home-head{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.mark{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.notice{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:.8125rem;margin-bottom:14px}
.notice b{color:var(--primary);font-size:.75rem}
.notice .n-ic{width:28px;height:28px;border-radius:50%;background:var(--kraft);display:grid;place-items:center;flex:none}
.notice .n-txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:220px;overflow:hidden;margin-bottom:22px}
.hero h2{margin:0 0 10px;font-size:1.5rem;line-height:1.4}
.hero p{margin:0 0 16px;font-size:.8125rem;opacity:.9}
.hero .art{width:150px;height:150px;border-radius:50%;background:var(--sprout);display:grid;place-items:center;flex:none}
.hero .art svg{width:130px;height:130px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-head h2{margin:0;font-size:1.25rem}
.block{margin-bottom:22px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.tag:active{transform:scale(.985)}
.hscroll .tag{width:184px;flex:none}
.tag-img{position:relative;height:150px;display:grid;place-items:center}
.tag-img::before{content:"";position:absolute;top:10px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tag-img svg.art{width:120px;height:120px}
.heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.heart.on{color:var(--danger)}
.heart.on svg{fill:currentColor}
.heart.pop{animation:bump .35s}
.tag-body{padding:12px;display:flex;flex-direction:column;gap:2px}
.tag-body h3{margin:0;font-size:.9375rem;line-height:1.45}
.tag-body p{margin:0;font-size:.6875rem;color:var(--muted)}
.tag-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.price{font-weight:700;color:var(--primary);font-size:1rem}
.price small{font-size:.6875rem;color:var(--muted);font-weight:400}
.add{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.add:active{transform:scale(.9)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.coupon{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.coupon .stub{width:96px;align-self:stretch;background:var(--kraft);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);border-right:2px dashed var(--bg)}
.coupon .stub b{font-size:1.25rem;line-height:1.3}
.coupon .stub span{font-size:.6875rem;font-weight:500}
.coupon .mid{flex:1;padding:12px 8px 12px 14px}
.coupon .mid b{display:block;font-size:.9375rem}
.coupon .mid span{font-size:.75rem;color:var(--muted)}
.coupon .go{padding-right:14px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);width:100%;text-align:left}
.banner b{display:block}
.banner span{font-size:.8125rem;color:var(--muted)}
.brand-card{background:var(--kraft);color:var(--ink);border-radius:20px;padding:20px}
.brand-card h2{margin:0 0 10px;font-size:1.25rem}
.brand-card p{margin:0 0 12px;font-size:.875rem;line-height:1.7}
.brand-card .more{display:none}
.brand-card.open .more{display:block}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:var(--surface);color:var(--ink);padding:3px 12px;border-radius:14px;font-size:.75rem;font-weight:500}
.cta-card{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px}
.cta-card h2{margin:0;font-size:1.125rem}
.cta-card p{margin:0;font-size:.8125rem;color:var(--muted)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.quick{display:flex;gap:10px}
.quick button{flex:1;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--ink)}
.quick button svg{color:var(--primary)}
.progress{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sprout);border-radius:5px}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:.9375rem;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.shortcuts{display:flex;gap:10px;margin-bottom:12px}
.shortcuts button{flex:1;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.875rem}
.shortcuts svg{color:var(--primary)}
.count{background:var(--surface-2);color:var(--primary);border-radius:10px;font-size:.6875rem;font-weight:700;padding:0 8px;line-height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:.875rem;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.line{border-color:var(--primary);color:var(--primary);background:transparent;font-size:.8125rem}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.8125rem;color:var(--muted)}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:32px;padding:0 10px;font-size:.8125rem}
.empty{text-align:center;padding:48px 16px;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty svg.art{width:96px;height:96px}
.empty b{color:var(--ink);font-size:1.0625rem}

.detail-img{position:relative;height:300px;display:grid;place-items:center;margin:0 -16px}
.detail-img svg.art{width:230px;height:230px}
.detail-img .icon-btn{position:absolute;top:16px;border:0}
.detail-img .icon-btn.l{left:16px}.detail-img .icon-btn.r{right:16px;color:var(--muted)}
.detail-img .icon-btn.r.on{color:var(--danger)}.detail-img .icon-btn.r.on svg{fill:currentColor}
.sheet-body{background:var(--surface);margin:0 -16px;padding:20px 20px 28px;border-radius:28px 28px 0 0;min-height:calc(100% - 300px);display:grid;gap:14px;align-content:start}
.sheet-body h1{margin:0;font-size:1.5rem;line-height:1.4}
.meta{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--muted)}
.meta svg{color:var(--sprout)}
.stars{display:inline-flex;gap:1px;color:var(--accent)}
.stars svg{fill:currentColor}
.stars.off svg{fill:none}
.price-row{display:flex;align-items:center;justify-content:space-between}
.price-big{font-size:1.75rem;font-weight:700;color:var(--primary)}
.price-big small{font-size:.8125rem;color:var(--muted);font-weight:400}
.stock{background:var(--surface-2);color:var(--primary);font-size:.75rem;font-weight:500;padding:2px 12px;border-radius:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:22px;background:var(--surface-2)}
.seg button{flex:1;height:36px;border-radius:18px;font-weight:500;font-size:.875rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.specs{background:var(--bg);border-radius:14px;padding:14px;display:grid;gap:8px;font-size:.875rem}
.specs div{display:flex;gap:12px}.specs span{width:44px;color:var(--muted);font-size:.8125rem;flex:none}
.stepper{display:inline-flex;align-items:center;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg)}
.stepper button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.stepper b{min-width:28px;text-align:center}
.qty-row{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.review{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.review .top{display:flex;align-items:center;gap:10px}
.review .av{width:32px;height:32px;border-radius:50%;background:var(--kraft);display:grid;place-items:center;font-weight:700;font-size:.875rem;color:var(--ink)}
.review .top>div{flex:1;line-height:1.3}.review .top b{font-size:.8125rem}.review .top small{color:var(--muted);font-size:.75rem}
.review p{margin:0;font-size:.8125rem;line-height:1.6}
.rate-input{display:flex;gap:4px;color:var(--accent)}
.rate-input button{color:var(--accent)}
.rate-input button.on svg{fill:currentColor}
.action-bar{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:10}
.action-bar .fav-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.action-bar .fav-btn.on{color:var(--danger)}.action-bar .fav-btn.on svg{fill:currentColor}
.action-bar .btn{flex:1;padding:0 8px}

.list{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.item .thumb{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;flex:none;cursor:pointer}
.item .thumb svg{width:60px;height:60px}
.item .info{flex:1;min-width:0;display:grid;gap:2px}
.item .info h3{margin:0;font-size:.9375rem;line-height:1.4}
.item .info small{color:var(--muted);font-size:.75rem}
.item .side{display:grid;gap:8px;justify-items:end}
.icon-plain{color:var(--muted);width:32px;height:32px;display:grid;place-items:center}
.icon-plain.danger{color:var(--danger)}
.group-label{font-size:.8125rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;margin-top:16px}
.summary div{display:flex;justify-content:space-between;font-size:.875rem}
.summary .total{font-size:1.0625rem;font-weight:700;padding-top:10px;border-top:1px dashed var(--line)}
.summary .total span:last-child{color:var(--primary)}
.free-hint{font-size:.75rem;color:var(--sprout);font-weight:500}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.order .oh{display:flex;justify-content:space-between;align-items:center}
.order .oh b{font-size:.9375rem}
.status{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:12px;background:var(--surface-2);color:var(--primary)}
.status.run{background:var(--accent);color:var(--on-accent)}
.thumbs{display:flex}
.thumbs span{width:44px;height:44px;border-radius:12px;border:2px solid var(--surface);margin-right:-10px;display:grid;place-items:center}
.thumbs svg{width:34px;height:34px}
.order .ol{display:flex;justify-content:space-between;align-items:center;font-size:.8125rem;color:var(--muted)}
.order .ol b{color:var(--ink);font-size:.9375rem}
.order .detail-lines{display:grid;gap:6px;font-size:.8125rem;border-top:1px dashed var(--line);padding-top:10px}
.order .detail-lines div{display:flex;justify-content:space-between}
.timeline{display:grid;gap:0;margin:4px 0 0;padding:0;list-style:none}
.timeline li{position:relative;padding:0 0 18px 34px;min-height:44px}
.timeline li::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child{padding-bottom:0}.timeline li:last-child::before{display:none}
.timeline li.done::before{background:var(--sprout)}
.timeline .dot{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--on-primary)}
.timeline li.done .dot{background:var(--sprout);border-color:var(--sprout)}
.timeline li.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.timeline b{display:block;font-size:.9375rem}.timeline small{color:var(--muted);font-size:.75rem}
.timeline li.todo b{color:var(--muted)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field>label{font-size:.8125rem;font-weight:500;color:var(--muted)}
.input{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.input:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.input input,.input select,.input textarea{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:.9375rem;padding:14px 0;resize:none}
.input input::placeholder,.input textarea::placeholder{color:var(--muted)}
.input select option{color:#1E2A1E}
.input.err{border-color:var(--danger)}
.err-msg{font-size:.75rem;color:var(--danger);min-height:0}
.auth-hero{display:flex;align-items:center;gap:14px;margin:16px 0}
.auth-hero .art{width:88px;height:88px;border-radius:50%;background:#DDEBC8;display:grid;place-items:center;flex:none}
.auth-hero .art svg{width:68px;height:68px}
.auth-hero h2{margin:0;font-size:1.5rem;line-height:1.3}
.auth-hero p{margin:4px 0 0;font-size:.8125rem;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-size:.8125rem;color:var(--muted);margin-bottom:14px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.8125rem;margin-bottom:14px}
.note b{display:block;margin-bottom:2px}.note span{color:var(--muted);font-size:.75rem}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.info-card .r{display:flex;gap:12px;align-items:center}
.info-card .r .ci{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--primary);display:grid;place-items:center}
.info-card .r small{display:block;color:var(--muted);font-size:.75rem}
.info-card .r b{font-size:.9375rem}

.chat{display:grid;gap:12px;padding:8px 0}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:.875rem;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;justify-self:start;white-space:pre-wrap}
.bubble.me{justify-self:end;background:var(--primary);color:var(--on-primary);border-color:var(--primary);border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.status-line{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.status-line i{width:10px;height:10px;border-radius:50%;background:var(--sprout);display:block}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.chat-input{position:absolute;left:0;right:0;bottom:0;height:76px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-top:1px solid var(--line);z-index:10}
.chat-input input{flex:1;height:48px;border-radius:24px;border:0;background:var(--surface-2);padding:0 18px;outline:none;font-size:.9375rem;color:var(--ink)}
.chat-input input::placeholder{color:var(--muted)}
.chat-input button{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.page.chatpage{bottom:76px}

.profile-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--kraft);display:grid;place-items:center;font-size:1.5rem;color:var(--ink)}
.profile-card h2{margin:0;font-size:1.125rem}.profile-card p{margin:0;font-size:.8125rem;color:var(--muted)}
.level-card{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:16px;display:grid;gap:10px;margin-bottom:14px}
.level-card .progress{background:rgba(255,255,255,.18)}.level-card .progress i{background:var(--accent)}
.level-card b{font-size:1.0625rem}.level-card small{opacity:.85}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.menu>*{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);min-height:56px}
.menu>*:last-child{border-bottom:0}
.menu .mi{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--primary);display:grid;place-items:center;flex:none}
.menu .mt{flex:1;min-width:0}.menu .mt b{display:block;font-size:.9375rem;font-weight:500}.menu .mt small{color:var(--muted);font-size:.75rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .dng{color:var(--danger)}.menu .dng .mi{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.menu>*>svg:last-child{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tiles button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 4px;display:grid;justify-items:center;gap:6px;font-size:.8125rem;font-weight:500}
.tiles svg{color:var(--primary)}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--primary)}.switch.on::after{transform:translateX(20px);background:var(--on-primary)}
.pay{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;width:100%;text-align:left;font-weight:500}
.pay .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pay.on{border-color:var(--primary)}.pay.on .rad{border-color:var(--primary)}.pay.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
h3.h{margin:18px 0 10px;font-size:1rem}

.sheet-layer{position:absolute;inset:0;z-index:30;display:none}
.sheet-layer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,20,10,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px 28px;animation:up .24s ease-out}
.sheet h2{margin:0 0 14px;font-size:1.25rem}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:20px;padding:22px 20px 18px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(-46%) scale(.96);opacity:0}to{transform:translateY(-50%);opacity:1}}
.dialog h2{margin:0 0 8px;font-size:1.125rem}.dialog p{margin:0 0 14px;font-size:.875rem;color:var(--muted)}
.ann{padding:12px 0;border-bottom:1px solid var(--line)}.ann:last-child{border-bottom:0}
.ann small{color:var(--muted);font-size:.75rem}.ann b{display:block;margin:2px 0 4px}.ann p{margin:0;font-size:.8125rem;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:500}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:.8125rem;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function closeLayer(){const L=$('#layer');L.classList.remove('open');L.innerHTML=''}

function coupon(k,a,u,title,desc){const c=S.coupons[k];return `<div class="coupon"><div class="stub"><b class="serif">${a}</b><span>${u}</span></div><div class="mid"><b>${title}</b><span>${desc}</span></div><div class="go"><button class="btn sm" data-act="claim" data-k="${k}" ${c.got?'disabled':''}>${c.used?'已使用':c.got?'已領取':'領取'}</button></div></div>`}
function filtered(){let l=PROD.filter(p=>(S.cat==='全部'||p.cat===S.cat)&&(!S.q||(p.name+p.cat+p.farm).includes(S.q.trim())));if(S.sort==='asc')l=[...l].sort((a,b)=>a.price-b.price);if(S.sort==='desc')l=[...l].sort((a,b)=>b.price-a.price);return l}
function gridHtml(l){return l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('succulent',`找不到「${esc(S.q||S.cat)}」`,'試試其他關鍵字，或切換分類。',`<button class="btn sm sec" data-act="reset">清除條件</button>`)}
function ordersView(){
 const sub=`<div class="chips" style="margin-bottom:12px"><button class="chip ${S.orderTab==='hist'?'on':''}" data-act="orderTab" data-v="hist">歷史訂單</button><button class="chip ${S.orderTab==='prog'?'on':''}" data-act="orderTab" data-v="prog">訂單進度</button></div>`;
 if(!S.user)return sub+empty('herb','登入後查看訂單','登入即可查詢歷史訂單與配送進度。',`<button class="btn sm" data-act="go" data-to="login" data-tab="login">登入</button>`);
 const done=S.orders.filter(o=>o.step>=3),run=S.orders.filter(o=>o.step<3);
 if(S.orderTab==='hist')return sub+(done.length?`<div class="list">${done.map(o=>{const open=S.openOrders.has(o.id);return `<div class="order"><div class="oh"><b>#${o.id}</b><span class="status">已完成</span></div><div class="ol"><div class="thumbs">${o.items.map(i=>`<span style="background:${TONE[byId(i.id).kind]}">${art(byId(i.id).kind)}</span>`).join('')}</div><span>${o.date}</span></div><div class="ol"><span>${o.items.reduce((a,i)=>a+i.q,0)} 件商品</span><b>${NT(o.total)}</b></div>${open?`<div class="detail-lines">${o.items.map(i=>`<div><span>${byId(i.id).name} × ${i.q}</span><span>${NT(byId(i.id).price*i.q)}</span></div>`).join('')}</div>`:''}<div class="row2"><button class="btn sec sm" data-act="toggleorder" data-id="${o.id}">${open?'收合明細':'查看明細'}</button><button class="btn sm" data-act="reorder" data-id="${o.id}">再買一次</button></div></div>`}).join('')}</div>`:empty('flower','還沒有完成的訂單','完成的訂單會留在這裡。'));
 return sub+(run.length?`<div class="list">${run.map(o=>`<div class="order"><div class="oh"><b>#${o.id}</b><span class="status run">${STEPS[o.step]}</span></div><div class="ol"><span>預計 10/06 到貨</span><b>${NT(o.total)}</b></div><ol class="timeline">${STEPS.map((s,i)=>`<li class="${i<o.step?'done':i===o.step?'now':'todo'}"><span class="dot">${i<o.step?ic('check',12):''}</span><b>${s}</b><small>${o.times[i]||(i<=o.step?'剛剛':'尚未開始')}</small></li>`).join('')}</ol><div class="row2"><button class="btn sec sm" data-act="go" data-to="chat">聯絡客服</button><button class="btn sm" data-act="advance" data-id="${o.id}">模擬下一步（示範）</button></div></div>`).join('')}</div>`:empty('tree','目前沒有配送中的訂單','下單後可以在這裡追蹤進度。',`<button class="btn sm" data-act="tab" data-to="products">去逛逛</button>`));}

/* ============ 渲染 ============ */
function renderTab(){const top=S.stack[S.stack.length-1],R=ROUTES[top.r],cur=S.stack[0].r;
 const T=$('#tabbar');T.classList.toggle('hide',R.tab===false);
 const n=cnt();
 T.innerHTML=[['home','home'],['products','sprout'],['cart','cart'],['profile','user'],['settings','sliders']].map(([k,i])=>`<button class="tab ${cur===k?'on':''}" data-act="tab" data-to="${k}" aria-current="${cur===k}"><span class="pill-bg">${ic(i,22)}${k==='cart'&&n?`<span class="badge" id="badge">${n}</span>`:''}</span>${t(k)}</button>`).join('')}
function render(keep=true){
 const top=S.stack[S.stack.length-1],R=ROUTES[top.r],page=$('#screen');
 const saved={},sc=page.scrollTop;$$('input[id],textarea[id],select[id]',page).forEach(e=>saved[e.id]=e.type==='checkbox'?e.checked:e.value);
 page.className='page'+(R.tab!==false?' hastab':'')+(R.bar?' hasbar':'')+(R.cls?' '+R.cls:'');
 page.innerHTML=R.view(top);
 if(keep){page.scrollTop=sc;for(const id in saved){const e=document.getElementById(id);if(e&&e.type==='checkbox')e.checked=saved[id];else if(e&&id!=='sort'&&id!=='q')e.value=saved[id]}}
 else{void page.offsetWidth;page.classList.add('enter');page.scrollTop=0}
 renderTab();
 if(top.r==='chat'){const l=$('#chatlog');if(l)page.scrollTop=page.scrollHeight}
}
function isDark(){const t=S.prefs.theme;return t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyPrefs(){const r=document.documentElement;r.style.setProperty('--fs',S.prefs.fs);if(S.prefs.theme==='system')r.removeAttribute('data-theme');else r.dataset.theme=S.prefs.theme;document.documentElement.lang=S.prefs.lang==='zh'?'zh-Hant':'en'}
function fit(){const st=$('#stage');if(innerWidth<=500){st.style.width=st.style.height='';$('#device').style.transform='';return}
 const s=Math.min(1,(innerHeight-32)/917,(innerWidth-32)/412);st.style.width=412*s+'px';st.style.height=917*s+'px';$('#device').style.transform=`scale(${s})`}

/* ============ 動作 ============ */
function addCart(id,q=1){const x=S.cart.find(c=>c.id===id);if(x)x.q=Math.min(99,x.q+q);else S.cart.push({id,q});renderTab();const b=$('#badge');if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}}
function toggleFav(id){if(S.fav.has(id)){S.fav.delete(id);toast('已移出收藏')}else{S.fav.add(id);toast('已加入收藏')}}
function pushHist(id){S.hist=[id,...S.hist.filter(x=>x!==id)].slice(0,12)}
function afterLogin(){const a=S.after;S.after=null;if(a==='checkout'){S.stack=[{r:'cart'},{r:'checkout'}];render(false)}else if(a==='buy'){S.stack=[{r:'products'},{r:'checkout'}];render(false)}else tab('home')}
function botReply(q){if(/配送|運送|幾天|到貨|運費/.test(q))return'一般下單後 2–3 個工作天到貨；北部地區 10/12 起改為隔日到貨。單筆滿 NT$500 免運。';
 if(/退|換|補寄|破損|壞/.test(q))return'收到後 24 小時內拍照回報，破損或枯萎我們免費補寄，不需要寄回。';
 if(/養護|澆水|垂|黃|死|曬|日照|土/.test(q))return'先放在通風散光處 1–2 天，等土表乾了再澆透；葉片發黃可先剪除。包裹內的手寫養護卡有各品種的澆水頻率。';
 if(/優惠|折|券|活動/.test(q))return'到首頁「優惠活動」領取新苗禮與免運券，結帳時就能選用。';
 return'收到！我已通知苗農同仁，平均 1 分鐘內回覆你。也可以撥打 0800-123-456。'}
function sendChat(txt){txt=txt.trim();if(!txt)return;S.chat.push({me:true,t:txt});S.chat.push({typing:true});render();
 setTimeout(()=>{S.chat=S.chat.filter(m=>!m.typing);S.chat.push({me:false,t:botReply(txt)});if(S.stack[S.stack.length-1].r==='chat')render()},900)}

 fs(el){S.prefs.fs=+el.dataset.v;applyPrefs();render();fit()},
 lang(){openLayer(`<h2 class="serif">語言設定</h2>${[['zh','繁體中文'],['en','English']].map(([k,l])=>`<button class="opt" data-act="setlang" data-v="${k}">${l}${S.prefs.lang===k?ic('check',20):''}</button>`).join('')}<p class="meta" style="margin-top:12px">示範站：目前只翻譯選單與主要按鈕。</p>`)},
 setlang(el){S.prefs.lang=el.dataset.v;applyPrefs();closeLayer();render();toast(S.prefs.lang==='zh'?'已切換為繁體中文':'Language set to English')},
 'edit-profile'(){if(needLogin('請先登入'))return;openLayer(`<h2 class="serif">更改個人資料</h2>${inp('ep-name','暱稱','你的稱呼',{icon:'user',val:S.user.name})}${inp('ep-phone','手機','09xx-xxx-xxx',{icon:'phone',val:S.profile.phone})}<button class="btn block" data-act="save-profile">儲存</button>`)},
 'save-profile'(){clearErr();const n=$('#ep-name').value.trim(),p=$('#ep-phone').value.trim();let ok=true;if(!n)ok=fail('ep-name','請輸入暱稱');if(p&&!/^09\d{2}-?\d{3}-?\d{3}$/.test(p))ok=fail('ep-phone','手機格式不正確');if(!ok)return;S.user.name=n;S.profile.name=n;S.profile.phone=p;closeLayer();render();toast('個人資料已更新')},
 'edit-addr'(){openLayer(`<h2 class="serif">收件地址</h2>${inp('ea-addr','地址','縣市、路名、門牌',{icon:'pin',val:S.profile.addr})}<button class="btn block" data-act="save-addr">儲存</button>`)},
 'save-addr'(){clearErr();const a=$('#ea-addr').value.trim();if(a.length<6)return fail('ea-addr','請輸入完整地址');S.profile.addr=a;closeLayer();render();toast('收件地址已更新')},
 'edit-mail'(){openLayer(`<h2 class="serif">電子郵件</h2>${inp('em-mail','電子郵件','name@example.com',{type:'email',icon:'mail',val:S.user.email})}<button class="btn block" data-act="save-mail">儲存</button>`)},
 'save-mail'(){clearErr();const m=$('#em-mail').value.trim();if(!mailOk(m))return fail('em-mail','請輸入有效的電子郵件');S.user.email=m;closeLayer();render();toast('電子郵件已更新')},
 levels(){const l=level();openLayer(`<h2 class="serif">會員等級</h2>${LEVELS.map(x=>`<div class="ann"><b>${x.n}${x.n===l.n?'（目前）':''}</b><p>累積 ${x.min} 點起 · ${x.min===0?'首購折扣':x.min===500?'每月專屬優惠券':'免運門檻降為 NT$300'}</p></div>`).join('')}<p class="meta" style="margin-top:12px">每消費 NT$10 累積 1 點。</p>`)},
 cquick(el){sendChat(el.dataset.v)},
 sendcontact(){clearErr();const n=$('#ct-name').value.trim(),m=$('#ct-mail').value.trim(),g=$('#ct-msg').value.trim();let ok=true;if(!n)ok=fail('ct-name','請輸入姓名');if(!mailOk(m))ok=fail('ct-mail','請輸入有效的電子郵件');if(g.length<5)ok=fail('ct-msg','請至少寫 5 個字');if(!ok)return;toast('已收到你的訊息，我們會在 1 個工作天內回覆');back()},
 clearhist(){S.hist=[];toast('已清除瀏覽紀錄');render()}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(el.tagName==='FORM')return;if(ACT[a]){e.preventDefault();ACT[a](el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tag')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const l=filtered();$('#grid').innerHTML=gridHtml(l);$('#found').textContent=`共 ${l.length} 件`}
 if(e.target.matches('.input input,.input textarea,.input select')){const w=e.target.closest('.input');w.classList.remove('err')}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;const l=filtered();$('#grid').innerHTML=gridHtml(l)}});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();const i=$('#chat-in');const v=i.value;i.value='';sendChat(v);const n=$('#chat-in');if(n)n.focus()}});
addEventListener('resize',fit);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.prefs.theme==='system')render()});

applyPrefs();fit();render(false);
</script>
</body>
</html>
